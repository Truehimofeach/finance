<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh}
nav{display:flex;padding:6px 10px;border-bottom:1px solid #e0ddd6;background:#fff;position:sticky;top:0;z-index:100;overflow-x:auto;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}

.tab:not(.active):active{background:#f0ede4}
#content{padding:14px 16px 40px}
.st{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#aaa;margin:16px 0 10px}

.cv{font-size:18px;font-weight:300;color:#1a1a1a;letter-spacing:-.02em}
.cs{font-size:11px;color:#bbb;margin-top:2px}
.pos{color:#1a7a4a}.neg{color:#b83a2a}.gold{color:#8B6914}
.cc{background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:14px;margin-bottom:12px}
.ct{font-size:11px;font-weight:500;color:#aaa;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:10px;padding:2px 9px;border-radius:20px;border:1px solid #ddd;background:transparent;color:#aaa;cursor:pointer}

.lr{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#aaa}
.fc{background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:14px;margin-bottom:12px}
.fc.editing{border-color:#8B6914;background:#fffdf8}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.fg label{font-size:10px;color:#aaa;font-weight:500;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}

.btnr-wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 14px;border-radius:6px;border:none;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.btnp{background:#8B6914;color:#fff}.btng{background:transparent;border:1px solid #ddd;color:#888}.btnr2{background:transparent;border:1px solid #f0a0a0;color:#c04a3a}
.hint{font-size:11px;color:#bbb;margin-top:8px}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.drop input{display:none}
.sbox{margin-top:10px;font-size:12px;padding:8px 12px;border-radius:8px;display:none}

/* ── SCROLLABLE CHARTS ───────────────────────────── */
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.chart-scroll::-webkit-scrollbar{height:5px}
.chart-scroll::-webkit-scrollbar-track{background:#f0ede8;border-radius:3px}
.chart-scroll::-webkit-scrollbar-thumb{background:#c8c0b0;border-radius:3px}
.chart-scroll::-webkit-scrollbar-thumb:hover{background:#a09080}
/* ── MOBILE ADAPTATION ─────────────────────────────── */
@media (max-width:640px){
  #content{padding:10px 10px 40px}
  .tab{padding:10px 13px;font-size:11px;letter-spacing:.02em;gap:5px}
  .tab .tab-ic svg{width:14px;height:14px}
  .st{margin:12px 0 8px}
  /* Grids → single column */
  .g2,.g3{grid-template-columns:1fr}
  /* Cards: 2 per row on mobile */
  .cards3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards2{grid-template-columns:1fr 1fr}
  /* Forms: 2 cols */
  .fg{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* Portfolio snap — full width pie */
  .ps .fw{grid-template-columns:1fr 1fr}
  /* Bar labels */
  .binfo{min-width:80px;font-size:10px}
  .bl{width:52px;font-size:10px}
  /* Cards padding */
  .card{padding:10px}
  .cc,.fc{padding:10px}
  /* Form inputs — larger touch target */
  .fg input,.fg select{padding:8px 9px;font-size:13px}
  .btn{padding:8px 14px;font-size:12px}
  /* Scrollable chart wrapper */
  .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Snap card total */
  .ps-hd span:last-child{font-size:14px}
  /* Overview mini year grid */
  .yr-mini{min-width:0}
  /* Collapse buttons */
  .cbtn{font-size:11px;padding:7px 10px}
  /* Hide long labels on mobile */
  .lr{gap:8px}
  .li{font-size:10px}
  /* Toggle btn */
  .toggle-opt{padding:5px 9px;font-size:10px}
  /* Invest cards */
  .inv-acts{flex-wrap:wrap}
}
@media (max-width:400px){
  .cards3{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
  .binfo{min-width:70px;font-size:9px}
}

/* ── INSTRUMENT MANAGE MODAL ───────────────────── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex}
.modal-box{background:#fff;border-radius:12px;max-width:540px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid #f0ede8}
.modal-head-title{font-size:15px;font-weight:600;color:#1a1a1a}
.modal-close{background:none;border:none;cursor:pointer;color:#aaa;font-size:22px;line-height:1;padding:0 4px}
.modal-close:hover{color:#444}
.modal-body{overflow-y:auto;padding:16px 20px;flex:1}
.modal-foot{padding:12px 20px 16px;border-top:1px solid #f0ede8;display:flex;justify-content:flex-end;gap:8px}
.inst-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #f0ede8;border-radius:8px;margin-bottom:6px}
.inst-row input{flex:1;border:1px solid #e0ddd6;border-radius:6px;padding:5px 8px;font-size:12px;background:#faf9f7;min-width:0}
.inst-tag{font-size:10px;padding:2px 7px;border-radius:10px;background:#f0ede8;color:#888;white-space:nowrap}
.inst-sep{font-size:10px;color:#aaa;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 6px}
</style>

<script>
Chart.register(ChartDataLabels);
const M=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
const PAL={2018:'#999',2019:'#6b5fc4',2020:'#2e8c60',2021:'#c47b5a',2022:'#a07820',2023:'#3a7fc4',2024:'#8B6914',2025:'#2a9a5a',2026:'#c04a3a'};
const SC={uah_free:'#7ab8e8',uah_dep:'#2a66b5',uah_ovdp:'#0f2a5a',usd_free:'#7dcc9a',usd_ibkr:'#1b7a45',eur_free:'#d4a820'};
const PC=['#3a7fc4','#2a9a5a','#c04a3a','#8B6914'];
const PL=['Гривня','Долар','Акції','Євро'];
const DFL={uf:'Вільна',ud:'Депозит',uo:'ОВДП',sf:'Вільний',si2:'Акції',ef:'Вільне'};
const KEY='fin_v3';
const DC=[
  {code:'UAH',symbol:'₴',name:'Гривня',rateToBase:1},
  {code:'USD',symbol:'$',name:'Долар США',rateToBase:44.6},
  {code:'EUR',symbol:'€',name:'Євро',rateToBase:51},
];
let BS='₴';
const RT={
  contribution:{lbl:'Поповнення',color:'#3a7fc4'},
  withdrawal:{lbl:'Виведення',color:'#c04a3a'},
  dividends:{lbl:'Дивіденди/Купон',color:'#2a9a5a'},
  appreciation:{lbl:'Капіталізація',color:'#aaa'}
};
const IHT=RT;const OVT=RT; // backward-compat aliases

const DM={};
const DP=[];
const DI=[];
const DH=[];
const DO=[];

let DB={};
let CH={};
let activeTab='overview';
let ovMode='uah'; // Overview tab: 'uah' or 'usd' (historical rate)
let ovLoadingRates=false;
function lastDayOfMonth(year,month){return new Date(year,month+1,0);} // month: 0-11
function dKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nbuFmt(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
async function fetchNBURate(d){
  try{
    const r=await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?date='+nbuFmt(d)+'&valcode=USD&json');
    const data=await r.json();
    if(data&&data[0]&&data[0].rate)return data[0].rate;
  }catch(e){console.error('NBU fetch error',e);}
  return null;
}
async function ensureHistoricalRates(dates,onProgress){
  if(!DB.historicalRates)DB.historicalRates={};
  const missing=dates.filter(d=>!DB.historicalRates[dKey(d)]);
  if(!missing.length)return true;
  let done=0;
  await Promise.all(missing.map(async d=>{
    const rate=await fetchNBURate(d);
    if(rate)DB.historicalRates[dKey(d)]=rate;
    done++;
    if(onProgress)onProgress(done,missing.length);
  }));
  sv();
  return true;
}

function sv(){try{DB=migrate(DB);localStorage.setItem(KEY,JSON.stringify(DB));const el=document.getElementById('save-ind');if(el){el.textContent='✓ Збережено';el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',1500);}}catch(e){console.error('save error',e);}}
function getCurs(){return DB.currencies&&DB.currencies.length?DB.currencies:JSON.parse(JSON.stringify(DC));}
function getBase(){return DB.baseCurrency||'UAH';}
function getCur(code){return getCurs().find(c=>c.code===code)||{code,symbol:code,name:code,rateToBase:1};}
function toBase(amt,code){const rUah=getCur(code).rateToBase||1;const bUah=getCur(getBase()).rateToBase||1;return(amt||0)*rUah/bUah;}
function baseSym(){return getCur(getBase()).symbol||'₴';}
function updateBS(){BS=baseSym();}
function fmtB(n){return fmt(Math.round(n))+' '+BS;}
function fmtRecDate(s){
  // ISO date (2026-08-15) → "Сер 2026"
  if(s&&/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const d=new Date(s+'T00:00:00');
    const MN=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
    return MN[d.getMonth()]+' '+d.getFullYear();
  }
  return s||'';
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthStrToISO(s){
  if(!s)return todayISO();
  if(s instanceof Date&&!isNaN(s)){const y=s.getFullYear(),m=String(s.getMonth()+1).padStart(2,'0'),d=String(s.getDate()).padStart(2,'0');return y+'-'+m+'-'+d;}
  const str=String(s).trim();
  const isoMatch=str.match(/^(\d{4})-(\d{2})-(\d{2})/); // no trailing $ — tolerate extra content after
  if(isoMatch)return isoMatch[1]+'-'+isoMatch[2]+'-'+isoMatch[3];
  const MN=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
  const p=str.split(' ');
  if(p.length===2){const mi=MN.indexOf(p[0]);if(mi>=0)return p[1]+'-'+String(mi+1).padStart(2,'0')+'-01';}
  return todayISO();
}
// migrate(): fills ONLY missing fields on the loaded object — never overwrites
// data that's already there. Safe to call on every load, on old and new saves alike.
function migrate(db){
  if(!db.monthly)db.monthly={};
  if(!db.portfolio)db.portfolio=[];
  if(!db.invest)db.invest=[];
  if(!db.ibkr_history)db.ibkr_history=[];
  if(!db.ovdp_history)db.ovdp_history=[];
  if(!db.ibkr_income)db.ibkr_income=[];
  if(!db.ibkr_labels)db.ibkr_labels=['Дивіденд VT','Купон US-T 4%','Поповнення','Купівля акцій','Продаж акцій'];
  if(!db.customInvests)db.customInvests=[];
  if(!db.investManual)db.investManual=[];
  if(!db.historicalRates)db.historicalRates={};
  if(!db.currencies||!db.currencies.length)db.currencies=JSON.parse(JSON.stringify(DC));
  if(!db.baseCurrency)db.baseCurrency='UAH';
  if(!db.ibkrName)db.ibkrName='IBKR';
  if(db.ibkrDesc===undefined)db.ibkrDesc='';
  if(!db.ovdpName)db.ovdpName='ОВДП';
  if(db.ovdpDesc===undefined)db.ovdpDesc='';
  // One-time migration: cumulative balances → event amounts (unified IBKR-style model)
  if(!db._v2){
    if(db.ovdp_history&&db.ovdp_history.length){
      let prevCum=0;
      db.ovdp_history=db.ovdp_history.map((r,i)=>{
        const amt=i===0?r.total:r.total-prevCum;
        prevCum=r.total;
        return{...r,total:amt};
      });
    }
    if(db.customInvests&&db.customInvests.length){
      db.customInvests=db.customInvests.map(inv=>{
        if(!inv.records||!inv.records.length)return inv;
        let prevCum=0;
        const newRecs=inv.records.map((r,i)=>{
          const amt=i===0?r.value:r.value-prevCum;
          prevCum=r.value;
          return{...r,value:amt};
        });
        return{...inv,records:newRecs};
      });
    }
    db._v2=true;
  }
  // One-time migration: unify IBKR/OVDP/custom into a single flat investments list
  if(!db._v3){
    if(!db.investments)db.investments=[];
    if(!db.investDescs)db.investDescs=[];
    if(!db.investArchived)db.investArchived=[];
    const remember=d=>{if(d&&!db.investDescs.includes(d))db.investDescs.push(d);};
    // IBKR: split by label (VT / US-T), fallback to ibkrName bucket
    if(db.ibkr_history&&db.ibkr_history.length){
      db.ibkr_history.forEach(r=>{
        const lbl=r.label||'';
        let desc=db.ibkrName||'IBKR';
        if(lbl.includes('VT'))desc='VT';
        else if(lbl.includes('US-T'))desc='US-T';
        remember(desc);
        db.investments.push({date:monthStrToISO(r.date),desc,currency:'USD',type:r.type||'appreciation',amount:r.usd||0,label:r.label||''});
      });
    }
    // OVDP: single bucket named after ovdpName
    if(db.ovdp_history&&db.ovdp_history.length){
      const descO=db.ovdpName||'ОВДП';remember(descO);
      db.ovdp_history.forEach(r=>{
        db.investments.push({date:monthStrToISO(r.date),desc:descO,currency:'UAH',type:r.type||'contribution',amount:r.total||0,label:''});
      });
    }
    // Custom instruments: bucket named after instrument name
    if(db.customInvests&&db.customInvests.length){
      db.customInvests.forEach(inv=>{
        const descC=inv.name||'Інвестиція';remember(descC);
        (inv.records||[]).forEach(r=>{
          db.investments.push({date:monthStrToISO(r.date),desc:descC,currency:inv.currency||'UAH',type:r.type||'contribution',amount:r.value||0,label:''});
        });
      });
    }
    db.investments.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    db._v3=true;
  }
  // One-time fix: normalize any non-ISO dates already saved in investments (fixes v3's date bug)
  if(!db._v4){
    if(db.investments&&db.investments.length){
      db.investments=db.investments.map(r=>({...r,date:monthStrToISO(r.date)}));
      db.investments.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    }
    db._v4=true;
  }
  return db;
}

function calcS(s){
  if(s&&s.type==='flex'){

  }

  const bR=getCur(getBase()).rateToBase||1;const ur=getCur('USD').rateToBase||s.rates?.usd||44.6;const er=getCur('EUR').rateToBase||s.rates?.eur||51;const extraUah=(s.extra||[]).reduce((a,it)=>a+(it.cur==='UAH'?it.amt:(it.cur==='USD'?it.amt*ur:it.amt*er)),0)/bR;const extraFreeUah=(s.extra||[]).filter(i=>i.free).reduce((a,it)=>a+(it.cur==='UAH'?it.amt:(it.cur==='USD'?it.amt*ur:it.amt*er)),0)/bR;
  const uf=(s.uah?.free||0)/bR,ud=(s.uah?.deposit||0)/bR,uo=(s.uah?.ovdp||0)/bR;
  const sf=s.usd?.free||0,si=s.usd?.ibkr||0;const ef=s.eur?.free||0;
  const ut=uf+ud+uo,st2=(sf+si)*ur/bR,et=ef*er/bR,total=ut+st2+et+extraUah;
  return{uahFree:uf,uahDep:ud,uahOvdp:uo,usdFree:sf,usdIbkr:si,eurFree:ef,uahTotal:ut,usdTotalUah:st2,eurTotalUah:et,total,freeUah:uf+sf*ur/bR+ef*er/bR+extraFreeUah,inWorkUah:ud+uo+si*ur/bR+(extraUah-extraFreeUah),usdR:ur/bR,eurR:er/bR};}

    // ── Excel import for income/expense (multi-year) ──
    const openMyImportBtn=document.getElementById('btn-open-my-import');
    const myImportForm=document.getElementById('my-import-form');
    if(openMyImportBtn&&myImportForm)openMyImportBtn.onclick=()=>{myImportForm.style.display=myImportForm.style.display==='none'?'block':'none';};
    const cancelMyImportBtn=document.getElementById('btn-cancel-my-import');
    if(cancelMyImportBtn)cancelMyImportBtn.onclick=()=>{myImportForm.style.display='none';document.getElementById('my-imp-status').textContent='';};
    function parseMonthValue(v){
      if(v==null||v==='')return null;
      if(typeof v==='number')return Math.round(v)-1; // 1-12 -> 0-11
      const s=String(v).trim().toLowerCase();
      const num=parseInt(s);
      if(!isNaN(num)&&num>=1&&num<=12)return num-1;
      const idx=M.findIndex(m=>m.toLowerCase().startsWith(s.slice(0,3)));
      return idx>=0?idx:null;
    }
    const doMyImportBtn=document.getElementById('btn-do-my-import');
    if(doMyImportBtn)doMyImportBtn.onclick=()=>{
      const fileInp=document.getElementById('my-imp-file');
      const status=document.getElementById('my-imp-status');
      const file=fileInp.files[0];
      if(!file){alert('Оберіть файл');return;}
      status.textContent='Читання файлу…';
      const reader=new FileReader();
      reader.onerror=()=>{status.textContent='Помилка читання файлу';};
      reader.onload=ev=>{
        try{
          const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
          const sheet=wb.Sheets[wb.SheetNames[0]];
          const json=XLSX.utils.sheet_to_json(sheet,{defval:''});
          if(!json.length){status.textContent='Файл порожній';return;}
          const cols=Object.keys(json[0]);
          const findCol=names=>cols.find(c=>names.some(n=>c.toLowerCase().trim()===n));
          const yearCol=findCol(['рік','year']);
          const monthCol=findCol(['місяць','month']);
          const incCol=findCol(['доходи','дохід','income','inc']);
          const expCol=findCol(['витрати','expense','exp']);
          if(!yearCol||!monthCol){status.textContent='Не знайдено колонки "Рік" і "Місяць"';return;}
          let imported=0,skipped=0;
          json.forEach(row=>{
            const yr=parseInt(row[yearCol]);
            const mi=parseMonthValue(row[monthCol]);
            if(!yr||mi==null){skipped++;return;}
            const inc=incCol&&row[incCol]!==''?parseFloat(row[incCol]):null;
            const exp=expCol&&row[expCol]!==''?parseFloat(row[expCol]):null;
            if(inc==null&&exp==null){skipped++;return;}
            if(!DB.monthly[yr])DB.monthly[yr]={inc:Array(12).fill(null),exp:Array(12).fill(null)};
            if(inc!=null)DB.monthly[yr].inc[mi]=inc;
            if(exp!=null)DB.monthly[yr].exp[mi]=exp;
            imported++;
          });
          sv();
          status.innerHTML='<span style="color:#1a7a4a">✓ Імпортовано '+imported+' місяців'+(skipped?', пропущено '+skipped:'')+'</span>';
          setTimeout(()=>{myImportForm.style.display='none';years=gYears();selY=Math.max(...years);build();},900);
        }catch(e){status.textContent='Помилка: '+e.message;console.error(e);}
      };
      reader.readAsArrayBuffer(file);
    };
    document.getElementById('btbl').onclick=()=>{tOpen=!tOpen;document.getElementById('cyw').style.display=tOpen?'block':'none';document.getElementById('btbl').innerHTML=`<span>${tOpen?'▲':'▼'} Місячна таблиця — ${selY}</span><span style="font-size:10px;color:#aaa">${fc} з 12 місяців</span>`;if(tOpen)bldTbl();};
    function bldTbl(){const tb=document.getElementById('ctb');if(!tb)return;tb.innerHTML='';M.forEach((m,i)=>{const inc=d.inc[i],exp=d.exp[i];if(inc==null&&exp==null){tb.innerHTML+=`<tr><td style="color:#ccc">${m}</td><td colspan="4" style="color:#ddd">—</td></tr>`;return;}const b=(inc||0)-(exp||0);tb.innerHTML+=`<tr data-m="${i}" style="cursor:pointer"><td>${m}</td><td class="gold">${inc!=null?fmt(inc):'—'}</td><td>${exp!=null?fmt(exp):'—'}</td><td class="${b>=0?'pos':'neg'}">${b>=0?'+':''}${fmt(b)}</td><td><button class="ic" data-m="${i}">✎</button></td></tr>`;});document.querySelectorAll('#ctb tr[data-m]').forEach(tr=>{tr.onclick=(e)=>{if(e.target.tagName==='BUTTON')return;ledit(+tr.dataset.m);};const bn=tr.querySelector('.ic');if(bn)bn.onclick=(e)=>{e.stopPropagation();ledit(+bn.dataset.m);};});}
    if(tOpen)bldTbl();
    function ledit(mi){document.getElementById('fy').value=selY;document.getElementById('fm').value=mi;document.getElementById('fi').value=d.inc[mi]||'';document.getElementById('fe').value=d.exp[mi]||'';document.getElementById('bdl').style.display='inline-block';document.getElementById('cyt').textContent=`Редагувати: ${M[mi]} ${selY}`;document.getElementById('cyf').classList.add('editing');document.getElementById('bdl').onclick=()=>{DB.monthly[selY].inc[mi]=null;DB.monthly[selY].exp[mi]=null;sv();build();};}
    document.getElementById('bsv').onclick=()=>{const yr=+document.getElementById('fy').value;const mi=+document.getElementById('fm').value;const inc=parseFloat(document.getElementById('fi').value)||null;const exp=parseFloat(document.getElementById('fe').value)||null;if(!DB.monthly[yr])DB.monthly[yr]={inc:Array(12).fill(null),exp:Array(12).fill(null)};DB.monthly[yr].inc[mi]=inc;DB.monthly[yr].exp[mi]=exp;sv();if(yr===selY)build();};
    document.getElementById('bcl').onclick=()=>{document.getElementById('fi').value='';document.getElementById('fe').value='';document.getElementById('bdl').style.display='none';document.getElementById('cyt').textContent='Додати / редагувати місяць';document.getElementById('cyf').classList.remove('editing');};
  }
  document.getElementById('content').innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px"><div class="st" style="margin:0">Поточний рік</div><div class="pills" id="cyp">${gYears().map(y=>`<div class="pill ${y==selY?'on':''}" data-y="${y}" style="border-color:${y==selY?PAL[y]:'#ddd'};color:${y==selY?PAL[y]:'#aaa'}">${y}</div>`).join('')}</div></div><div id="cy-body"></div>`;
  document.querySelectorAll('#cyp .pill').forEach(p=>{p.onclick=()=>{selY=+p.dataset.y;tOpen=false;document.querySelectorAll('#cyp .pill').forEach(pp=>{const py=+pp.dataset.y;pp.classList.toggle('on',py==selY);pp.style.borderColor=py==selY?PAL[py]:'#ddd';pp.style.color=py==selY?PAL[py]:'#aaa';});build();};});
  build();
}

// ── PORTFOLIO ────────────────────────────────────────────────
function renderPortfolio(){
  let flexItems=[];

  function gn(id){return parseFloat(document.getElementById(id)?.value)||0;}

  function sBars(s){const c=calcS(s);
    if(s.type==='flex'){const r=s.rates||{usd:44.6,eur:51};function toUf(item){if(item.cur==='UAH')return item.amt||0;if(item.cur==='USD')return(item.amt||0)*(r.usd||44.6);if(item.cur==='EUR')return(item.amt||0)*(r.eur||51);return 0;}function fmtN(item){if(item.cur==='UAH')return fmt(item.amt||0)+' '+BS;if(item.cur==='USD')return'$'+(item.amt||0).toLocaleString('en');return'€'+(item.amt||0).toLocaleString('en');}const GRP=['UAH','USD','EUR'];const GCOL={UAH:'#3a7fc4',USD:'#2a9a5a',EUR:'#8B6914'};const GLBL={UAH:'Гривня',USD:'Долар',EUR:'Євро'};const GCLRS={UAH:['#7ab8e8','#2a66b5','#0f2a5a','#1a4a8a'],USD:['#7dcc9a','#1b7a45','#0a4a25'],EUR:['#d4a820','#a07010']};const items=s.items||[];return GRP.map(cur=>{const ci=items.filter(i=>i.cur===cur);if(!ci.length)return'';const tUah=ci.reduce((a,i)=>a+toUf(i),0);if(!tUah)return'';const pct=Math.round(tUah/c.total*100);const clrs=GCLRS[cur];const segs=ci.map((item,idx)=>({v:toUf(item),c:clrs[idx%clrs.length],t:item.lbl,d:mode==='uah'?fmt(Math.round(toUf(item)))+' '+BS:fmtN(item)}));const dispT=mode==='uah'?fmt(Math.round(tUah))+' '+BS:(cur==='UAH'?fmt(Math.round(tUah))+' '+BS:cur==='USD'?'$'+ci.reduce((a,i)=>a+(i.amt||0),0).toLocaleString('en'):'€'+ci.reduce((a,i)=>a+(i.amt||0),0).toLocaleString('en'));const inn=segs.map(sg=>`<div style="flex:${sg.v||.001};background:${sg.c}" title="${sg.t}"></div>`).join('');const sub=segs.map(sg=>`<span style="display:inline-flex;align-items:center;gap:3px;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:${sg.c};display:inline-block;flex-shrink:0"></span><span style="color:#888">${sg.t}</span><span style="color:#444;font-weight:500">${sg.d}</span></span>`).join('<span style="color:#ddd;margin:0 2px">·</span>');return`<div class="brow" style="align-items:flex-start;margin-bottom:11px"><span class="bl" style="color:${GCOL[cur]};padding-top:2px">${GLBL[cur]}</span><div style="flex:1"><div class="seg-track"><div style="width:${pct}%;display:flex;overflow:hidden">${inn}</div></div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:5px;font-size:10px">${sub}</div></div><span class="binfo" style="padding-top:2px">${dispT} <span class="bpct">· ${pct}%</span></span></div>`;}).join('');}
    if(!isR(s)){const total=s.total||1;return[['Гривня','#3a7fc4',s.uah],['Євро','#8B6914',s.eur_uah],['Долар','#2a9a5a',s.usd_uah],['IBKR','#c04a3a',s.ibkr_uah]].map(([l,col,v])=>{const p=Math.round(v/total*100);return`<div class="brow"><span class="bl" style="color:${col}">${l}</span><div class="btr"><div class="bf" style="width:${p}%;background:${col}"></div></div><span class="binfo">${fmt(v)} ${BS} <span class="bpct">· ${p}%</span></span></div>`;}).join('');}
    if(mode==='uah'){const p=v=>Math.round(v/c.total*100);function rB(lbl,col,val,segs){const pct=p(val);const inn=segs.map(sg=>`<div style="flex:${sg.v||.001};background:${sg.c}" title="${sg.t||''}"></div>`).join('');const sub=segs.filter(sg=>sg.v>0).map(sg=>`<span style="display:inline-flex;align-items:center;gap:3px;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:${sg.c};display:inline-block;flex-shrink:0"></span><span style="color:#888">${sg.t}</span><span style="color:#444;font-weight:500">${sg.d||fmt(Math.round(sg.v))}</span></span>`).join('<span style="color:#ddd;margin:0 2px">·</span>');return`<div class="brow" style="align-items:flex-start;margin-bottom:11px"><span class="bl" style="color:${col};padding-top:2px">${lbl}</span><div style="flex:1"><div class="seg-track"><div style="width:${pct}%;display:flex;overflow:hidden">${inn}</div></div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:5px;font-size:10px">${sub}</div></div><span class="binfo" style="padding-top:2px">${fmt(Math.round(val))} ${BS} <span class="bpct">· ${pct}%</span></span></div>`;}
      const L=s.labels||DFL;
      return rB('Гривня','#3a7fc4',c.uahTotal,[{v:c.uahFree,c:SC.uah_free,t:L.uf||DFL.uf,d:fmt(c.uahFree)+' '+BS},{v:c.uahDep,c:SC.uah_dep,t:L.ud||DFL.ud,d:fmt(c.uahDep)+' '+BS},{v:c.uahOvdp,c:SC.uah_ovdp,t:L.uo||DFL.uo,d:fmt(c.uahOvdp)+' '+BS}])+rB('Долар','#2a9a5a',c.usdTotalUah,[{v:c.usdFree*c.usdR,c:SC.usd_free,t:L.sf||DFL.sf,d:mode==='uah'?fmt(Math.round(c.usdFree*c.usdR))+' '+BS:'$'+c.usdFree.toLocaleString('en')},{v:c.usdIbkr*c.usdR,c:SC.usd_ibkr,t:L.si2||DFL.si2,d:mode==='uah'?fmt(Math.round(c.usdIbkr*c.usdR))+' '+BS:'$'+c.usdIbkr.toLocaleString('en')}])+rB('Євро','#8B6914',c.eurTotalUah,[{v:c.eurFree*c.eurR,c:SC.eur_free,t:L.ef||DFL.ef,d:mode==='uah'?fmt(Math.round(c.eurFree*c.eurR))+' '+BS:'€'+c.eurFree.toLocaleString('en')}]);
    }else{function nB(lbl,col,segs,dv,subItems){const inn=segs.map(sg=>`<div style="flex:${sg.v||.001};background:${sg.c}"></div>`).join('');const sub=subItems.filter(sg=>sg.v>0).map(sg=>`<span style="display:inline-flex;align-items:center;gap:3px;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:${sg.c};display:inline-block;flex-shrink:0"></span><span style="color:#888">${sg.t}</span><span style="color:#444;font-weight:500">${sg.d}</span></span>`).join('<span style="color:#ddd;margin:0 2px">·</span>');return`<div class="brow" style="align-items:flex-start;margin-bottom:11px"><span class="bl" style="color:${col};padding-top:2px">${lbl}</span><div style="flex:1"><div class="seg-track">${inn}</div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:5px;font-size:10px">${sub}</div></div><div style="text-align:right;min-width:110px;flex-shrink:0;padding-top:2px"><div style="font-size:11px;color:#555">${dv}</div></div></div>`;}
      const L2=s.labels||DFL;

  function fv(si){

    <div class="fg"><div><label><input class="fl-edit" data-key="sf" value="${v.labels.sf}" style="width:60px;border:none;border-bottom:1px dashed #ccc;background:transparent;font-size:10px;color:#aaa;text-transform:uppercase;font-weight:600;letter-spacing:.04em;padding:0"> $</label><input id="psf" type="number" value="${v.sf||''}"></div><div><label><input class="fl-edit" data-key="si2" value="${v.labels.si2}" style="width:60px;border:none;border-bottom:1px dashed #ccc;background:transparent;font-size:10px;color:#aaa;text-transform:uppercase;font-weight:600;letter-spacing:.04em;padding:0"> $</label><input id="psi" type="number" value="${v.si2||''}"></div></div>

function genMonthOpts(sel){const MN=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];const now=new Date();let opts='<option value="">— оберіть —</option>';for(let i=0;i<36;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const lbl=MN[d.getMonth()]+' '+d.getFullYear();opts+=`<option value="${lbl}" ${sel===lbl?'selected':''}>${lbl}</option>`;}return opts;}

function allDescs(){return[...new Set((DB.investments||[]).map(r=>r.desc))];}
function activeDescs(){return allDescs().filter(d=>!(DB.investArchived||[]).includes(d));}
function archivedDescs(){return allDescs().filter(d=>(DB.investArchived||[]).includes(d));}
function rememberDesc(d){if(!DB.investDescs)DB.investDescs=[];if(d&&!DB.investDescs.includes(d))DB.investDescs.push(d);}
function recsForDesc(desc){return(DB.investments||[]).filter(r=>r.desc===desc);}
function calcSet(recs){
  let contGross=0,withdrawn=0,div=0,divNotReinv=0,cap=0;
  recs.forEach(r=>{const amt=toBase(r.amount||0,r.currency||'UAH');if(r.type==='contribution')contGross+=amt;else if(r.type==='withdrawal')withdrawn+=amt;else if(r.type==='dividends'){div+=amt;if(r.reinvested===false)divNotReinv+=amt;}else cap+=amt;});
  const cont=contGross+withdrawn; // net working capital (withdrawn already negative)
  const divReinv=div-divNotReinv;
  const investedTotal=contGross+divReinv; // "Вкладено" = зовнішні кошти + реінвестовані виплати
  const last=cont+divReinv+cap; // balance excludes non-reinvested dividends
  const profit=div+cap; // profit includes ALL dividends regardless of reinvestment
  return{cont,contGross,withdrawn,div,divNotReinv,divReinv,investedTotal,cap,last,profit};
}
function curBalDesc(desc,excludeIdxInDesc){
  // sum amounts (native currency, not base) for records with this desc, excluding one by position-within-desc-array
  const recs=recsForDesc(desc);
  let b=0;recs.forEach((r,i)=>{if(i===excludeIdxInDesc)return;b+=r.amount||0;});
  return b;
}

function renderInvest(){
  let ey=-1,eri=-1; // eri = index within DB.investments (global) of record being edited, -1 = adding new
  let yrMode='base'; // yearly summary donut/chart currency mode
  let selectedDescs=null; // null = all active descs selected by default
  let invMode='base'; // 'base' = convert all to base currency, 'native' = group by native currency
  let showArchived=false;

  function build(){
    const all=DB.investments||[];
    const active=activeDescs();
    const archived=archivedDescs();
    if(selectedDescs===null)selectedDescs=new Set(active);
    const visibleDescs=showArchived?[...active,...archived]:active;
    const filtered=all.filter(r=>selectedDescs.has(r.desc)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const curSet=[...new Set(filtered.map(r=>r.currency||'UAH'))];
    const singleCur=curSet.length===1?curSet[0]:null;
    // fmtM: format amount according to current mode — base currency, or native (only valid meaningfully when singleCur)
    function fmtM(baseAmt,nativeAmt,nativeCurCode){
      if(invMode==='native'&&nativeCurCode){const sym=getCur(nativeCurCode).symbol;return fmt(Math.round(nativeAmt))+' '+sym;}
      return fmtB(baseAmt);
    }
    const setCalc=calcSet(filtered); // base-currency totals
    // native-currency totals (only meaningful if singleCur; otherwise per-currency breakdown)
    function calcNative(recs,curCode){
      let contGross=0,withdrawn=0,div=0,divNotReinv=0,cap=0;
      recs.filter(r=>(r.currency||'UAH')===curCode).forEach(r=>{const amt=r.amount||0;if(r.type==='contribution')contGross+=amt;else if(r.type==='withdrawal')withdrawn+=amt;else if(r.type==='dividends'){div+=amt;if(r.reinvested===false)divNotReinv+=amt;}else cap+=amt;});
      const cont=contGross+withdrawn;
      const divReinv=div-divNotReinv;
      const investedTotal=contGross+divReinv;
      return{cont,contGross,withdrawn,div,divNotReinv,divReinv,investedTotal,cap,last:cont+divReinv+cap,profit:div+cap};
    }
    const natCalc=singleCur?calcNative(filtered,singleCur):null;
    const profitPct=setCalc.contGross>0?((setCalc.profit/setCalc.contGross)*100).toFixed(1):null;
    // Money-weighted annualized rate: weight each contribution by amount and days held until today
    const todayD=new Date();
    let wDaysSum=0,wAmtSum=0;
    filtered.forEach(r=>{
      if(r.type!=='contribution')return;
      const amtB=toBase(r.amount||0,r.currency||'UAH');
      if(amtB<=0)return;
      const rd=r.date&&r.date.match(/^\d{4}-\d{2}-\d{2}$/)?new Date(r.date+'T00:00:00'):null;
      if(!rd)return;
      const days=(todayD-rd)/86400000;
      wDaysSum+=amtB*days;wAmtSum+=amtB;
    });
    const weightedYears=wAmtSum>0?wDaysSum/wAmtSum/365.25:null;
    const annualPct=(weightedYears&&weightedYears>0.02&&profitPct)?(parseFloat(profitPct)/weightedYears).toFixed(1):null;
    const divBase=filtered.reduce((a,r)=>a+(r.type==='dividends'?toBase(r.amount||0,r.currency||'UAH'):0),0);
    const capBase=filtered.reduce((a,r)=>a+(r.type==='appreciation'?toBase(r.amount||0,r.currency||'UAH'):0),0);
    const divNat=singleCur?filtered.filter(r=>(r.currency||'UAH')===singleCur&&r.type==='dividends').reduce((a,r)=>a+(r.amount||0),0):0;
    const capNat=singleCur?filtered.filter(r=>(r.currency||'UAH')===singleCur&&r.type==='appreciation').reduce((a,r)=>a+(r.amount||0),0):0;
    const notReinvBase=filtered.filter(r=>r.type==='dividends'&&r.reinvested===false).reduce((a,r)=>a+toBase(r.amount||0,r.currency||'UAH'),0);
    const notReinvNat=singleCur?filtered.filter(r=>(r.currency||'UAH')===singleCur&&r.type==='dividends'&&r.reinvested===false).reduce((a,r)=>a+(r.amount||0),0):0;
    const notReinvDisp=invMode==='native'&&singleCur?fmtM(0,notReinvNat,singleCur):fmtB(notReinvBase);
    const divPct=setCalc.contGross>0?((divBase/setCalc.contGross)*100).toFixed(1):null;
    const capPct=setCalc.contGross>0?((capBase/setCalc.contGross)*100).toFixed(1):null;

    // Cumulative line chart data — base currency if mixed, native if single currency + native mode
    let cumArr=[];let rs=0;
    filtered.forEach(r=>{
      const isNonReinv=r.type==='dividends'&&r.reinvested===false;
      if(!isNonReinv){
        if(invMode==='native'&&singleCur)rs+=(r.amount||0);
        else rs+=toBase(r.amount||0,r.currency||'UAH');
      }
      cumArr.push(rs); // flat point for non-reinvested — doesn't move the line
    });
    const chartSym=invMode==='native'&&singleCur?getCur(singleCur).symbol:BS;

    const contDisp=invMode==='native'&&natCalc?fmtM(0,natCalc.investedTotal,singleCur):fmtB(setCalc.investedTotal);
    const contGrossDisp=invMode==='native'&&natCalc?fmtM(0,natCalc.contGross,singleCur):fmtB(setCalc.contGross);
    const divReinvDisp=invMode==='native'&&natCalc?fmtM(0,natCalc.divReinv,singleCur):fmtB(setCalc.divReinv);
    const withdrawnDisp=invMode==='native'&&natCalc?fmtM(0,Math.abs(natCalc.withdrawn),singleCur):fmtB(Math.abs(setCalc.withdrawn));
    const lastDisp=invMode==='native'&&natCalc?fmtM(0,natCalc.last,singleCur):fmtB(setCalc.last);
    const profitVal=invMode==='native'&&natCalc?natCalc.profit:setCalc.profit;
    const profitDisp=invMode==='native'&&natCalc?fmtM(0,natCalc.profit,singleCur):fmtB(setCalc.profit);
    const divDisp=invMode==='native'&&singleCur?fmtM(0,divNat,singleCur):fmtB(divBase);
    const capDisp=invMode==='native'&&singleCur?fmtM(0,capNat,singleCur):fmtB(capBase);
    const selectedListNote=`<div style="font-size:10px;color:#aaa;margin-bottom:6px">Обрано: ${[...selectedDescs].join(', ')||'—'}</div>`;
    const mixedNote=invMode==='native'&&!singleCur?`<div style="font-size:10px;color:#c48a3a;margin-bottom:8px">⚠ Обрані категорії мають різні валюти (${curSet.join(', ')}) — показано в ${BS}. Зніміть зайві категорії щоб бачити в нативній валюті.</div>`:'';

    const firstRec=filtered.length>0?filtered[0]:null;
    const startBoxHtml=firstRec?`<div style="background:#faf9f7;border:1px solid #e8e5de;border-radius:10px;padding:12px;margin-bottom:10px"><div style="font-size:10px;color:#aaa;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Стартова сума</div><span style="font-size:15px;font-weight:300">${fmt(Math.abs(firstRec.amount))} ${getCur(firstRec.currency||'UAH').symbol}</span> <span style="font-size:11px;color:#aaa">· ${firstRec.date&&firstRec.date.match(/^\d{4}/)?(new Date(firstRec.date+'T00:00:00')).toLocaleDateString('uk-UA'):firstRec.date} · ${firstRec.desc}</span></div>`:'';
    const metricsHtml=`${selectedListNote}${mixedNote}${startBoxHtml}<div class="cards3" style="margin-bottom:8px">
      <div class="card"><div class="cl">Вкладено <span style="color:#bbb;font-weight:400">(зовні + реінвест.)</span></div><div class="cv" style="color:#3a7fc4">${setCalc.investedTotal?contDisp:'—'}</div><div class="cs">${setCalc.contGross?'зовні '+contGrossDisp:''}${setCalc.divReinv>0.01?' · реінвест. '+divReinvDisp:''}${Math.abs(setCalc.withdrawn)>0.01?' · переказано -'+withdrawnDisp:''}</div></div>
      <div class="card"><div class="cl">Поточний баланс</div><div class="cv gold">${lastDisp}</div></div>
      <div class="card"><div class="cl">Загальний прибуток</div><div class="cv ${profitVal>=0?'pos':'neg'}">${profitVal?(profitVal>=0?'+':'')+profitDisp:'—'}</div><div class="cs">${profitPct?(+profitPct>=0?'+':'')+profitPct+'% за '+weightedYears.toFixed(1)+' р.'+(annualPct?' · ≈'+annualPct+'% річних':''):''}</div></div>
    </div>
    <div class="cards2" style="margin-bottom:12px">
      <div class="card"><div class="cl">з них Дивіденди/Купони <span style="color:#bbb;font-weight:400">(реалізовано)</span></div><div class="cv pos">${divBase?'+'+divDisp:'—'}</div><div class="cs">${divPct?divPct+'% — реальні гроші':''}</div></div>
      <div class="card"><div class="cl">з них Капіталізація <span style="color:#bbb;font-weight:400">(нереалізовано)</span></div><div class="cv ${capBase>=0?'':'neg'}" style="${capBase?'':'color:#aaa'}">${filtered.some(r=>r.type==='appreciation')?(capBase>=0?'+':'')+capDisp:'немає записів'}</div><div class="cs">${capPct&&filtered.some(r=>r.type==='appreciation')?capPct+'%':''}</div></div>
    </div>${notReinvBase>0.01?`<div style="margin-bottom:12px"><div class="card"><div class="cl">Виведено / не реінвестовано <span style="color:#bbb;font-weight:400">(в прибутку, не в балансі)</span></div><div class="cv" style="color:#8a6fc4">${notReinvDisp}</div></div></div>`:''}`;

    const filterPillsHtml=visibleDescs.map(d=>{
      const isArch=archived.includes(d);
      const on=selectedDescs.has(d);
      const borderC=on?'#8B6914':'#ddd';
      const textC=on?'#8B6914':'#aaa';
      return`<span style="display:inline-flex;align-items:stretch;border:1px solid ${borderC};border-radius:14px;overflow:hidden;${isArch?'opacity:.55':''}">
        <span class="pill-name" data-desc="${d}" style="padding:3px 10px;font-size:10px;cursor:pointer;color:${textC};${isArch?'font-style:italic':''};white-space:nowrap">${d}</span>
        <span class="pill-arch" data-desc-arch="${d}" title="${isArch?'Повернути з архіву':'Заархівувати'}" style="padding:3px 8px;font-size:10px;cursor:pointer;background:${borderC}14;border-left:1px solid ${borderC};display:flex;align-items:center;color:${textC}">${isArch?'↩':'📦'}</span>

    if(openImportBtn&&importForm){openImportBtn.onclick=()=>{importForm.style.display=importForm.style.display==='none'?'block':'none';};}
    const cancelImportBtn=document.getElementById('btn-cancel-import');
    if(cancelImportBtn)cancelImportBtn.onclick=()=>{importForm.style.display='none';document.getElementById('imp-status').textContent='';};
    function parseExcelDate(v){
      if(v==null||v==='')return null;
      if(v instanceof Date&&!isNaN(v)){
        // Build ISO date from LOCAL components — avoid UTC shift from toISOString()
        const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
        return y+'-'+m+'-'+d;
      }
      const s=String(v).trim();
      let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m)return m[1]+'-'+m[2]+'-'+m[3];
      m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/); // no trailing $ — ignore any time suffix
      if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
      return null;
    }
    const doImportBtn=document.getElementById('btn-do-import');
    if(doImportBtn)doImportBtn.onclick=()=>{
      const desc=document.getElementById('imp-desc').value.trim();
      const currency=document.getElementById('imp-cur').value;
      const fileInp=document.getElementById('imp-file');
      const status=document.getElementById('imp-status');
      if(!desc){alert('Вкажіть опис');return;}
      const file=fileInp.files[0];
      if(!file){alert('Оберіть файл');return;}
      status.textContent='Читання файлу…';
      const reader=new FileReader();
      reader.onerror=()=>{status.textContent='Помилка читання файлу';};
      reader.onload=ev=>{
        try{
          const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
          const sheet=wb.Sheets[wb.SheetNames[0]];
          const json=XLSX.utils.sheet_to_json(sheet,{defval:''});
          if(!json.length){status.textContent='Файл порожній';return;}
          // Find column names case-insensitively
          const cols=Object.keys(json[0]);
          const findCol=(names)=>cols.find(c=>names.some(n=>c.toLowerCase().trim()===n));
          const dateCol=findCol(['дата','date']);
          const typeCol=findCol(['тип','type']);
          const sumCol=findCol(['сума','amount','сума (грн)','sum']);
          if(!sumCol){status.textContent='Не знайдено колонку "Сума"';return;}
          let autoYear=new Date().getFullYear(),autoMonth=1; // fallback counter — plain integers, no timezone math
          let imported=0,skipped=0;
          json.forEach(row=>{
            const rawAmt=row[sumCol];
            const amt=parseFloat(String(rawAmt).replace(/[^0-9.\-]/g,''));
            if(!amt&&amt!==0){skipped++;return;}
            let dateISO=dateCol?parseExcelDate(row[dateCol]):null;
            if(!dateISO){
              dateISO=autoYear+'-'+String(autoMonth).padStart(2,'0')+'-01';
              autoMonth++;if(autoMonth>12){autoMonth=1;autoYear++;}
            }
            const typeRaw=typeCol?String(row[typeCol]||'').toLowerCase().trim():'';
            const type=typeRaw.includes('поповн')||typeRaw.includes('contrib')?'contribution':(typeRaw.includes('капітал')||typeRaw.includes('apprec')?'appreciation':(typeRaw.includes('вивед')||typeRaw.includes('withdraw')?'withdrawal':'dividends'));
            DB.investments.push({date:dateISO,desc,currency,type,amount:type==='withdrawal'?-Math.abs(amt):amt,note:''});
            imported++;
          });
          rememberDesc(desc);
          DB.investments.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
          sv();
          status.innerHTML='<span style="color:#1a7a4a">✓ Імпортовано '+imported+' записів'+(skipped?', пропущено '+skipped+' (без суми)':'')+'</span>';
          setTimeout(()=>{importForm.style.display='none';build();},900);
        }catch(e){status.textContent='Помилка: '+e.message;console.error(e);}
      };
      reader.readAsArrayBuffer(file);
    };

        if(!confirm(msg))return;

// ── ANALYSIS ─────────────────────────────────────────────
function renderAnalysis(){
  const years=gYears();
  // Collect all months with data across all years, flat list
  const flatMonths=[]; // {year, mi, inc, exp, bal}
  years.forEach(y=>{
    const d=DB.monthly[y];
    for(let mi=0;mi<12;mi++){
      if(d.inc[mi]!=null||d.exp[mi]!=null){
        const inc=d.inc[mi]||0,exp=d.exp[mi]||0;
        flatMonths.push({year:y,mi,inc,exp,bal:inc-exp});
      }
    }
  });
  const n=flatMonths.length;
  function median(arr){const s=[...arr].sort((a,b)=>a-b);const mid=Math.floor(s.length/2);return s.length%2?s[mid]:(s[mid-1]+s[mid])/2;}
  function stdDev(arr){const m=arr.reduce((a,v)=>a+v,0)/arr.length;const variance=arr.reduce((a,v)=>a+(v-m)**2,0)/arr.length;return Math.sqrt(variance);}

  const incArr=flatMonths.map(m=>m.inc);
  const expArr=flatMonths.map(m=>m.exp);
  const balArr=flatMonths.map(m=>m.bal);

  const avgInc=n?incArr.reduce((a,v)=>a+v,0)/n:0;
  const avgExp=n?expArr.reduce((a,v)=>a+v,0)/n:0;
  const avgBal=avgInc-avgExp;
  const medInc=n?median(incArr):0;
  const medExp=n?median(expArr):0;
  const savingsRate=avgInc>0?(avgBal/avgInc*100):0;

  const bestMonth=n?flatMonths.reduce((a,b)=>b.bal>a.bal?b:a):null;
  const worstMonth=n?flatMonths.reduce((a,b)=>b.bal<a.bal?b:a):null;
  const bestIncMonth=n?flatMonths.reduce((a,b)=>b.inc>a.inc?b:a):null;
  const bestExpMonth=n?flatMonths.reduce((a,b)=>b.exp>a.exp?b:a):null;

  const yearTotals=years.map(y=>({year:y,...tots(y)}));
  const bestYear=yearTotals.length?yearTotals.reduce((a,b)=>b.bal>a.bal?b:a):null;
  const worstYear=yearTotals.length?yearTotals.reduce((a,b)=>b.bal<a.bal?b:a):null;

  const surplusCount=flatMonths.filter(m=>m.bal>=0).length;
  const deficitCount=n-surplusCount;

  const incVolatility=n>1?stdDev(incArr):0;
  const incVolatilityPct=avgInc>0?(incVolatility/avgInc*100):0;

  // Year-over-year trend: average % change in yearly income across consecutive full years
  let yoyChanges=[];
  for(let i=1;i<yearTotals.length;i++){
    const prev=yearTotals[i-1].inc,cur=yearTotals[i].inc;
    if(prev>0)yoyChanges.push((cur-prev)/prev*100);
  }
  const avgYoy=yoyChanges.length?yoyChanges.reduce((a,v)=>a+v,0)/yoyChanges.length:null;

  document.getElementById('content').innerHTML=`
  <div class="st">Аналіз</div>
  <div style="font-size:11px;color:#999;margin-bottom:10px">Статистика по всіх ${n} місяцях з даними, ${years.length} років (${years[0]||'—'}–${years[years.length-1]||'—'})</div>

  <div class="st">Середні показники</div>
  <div class="cards3" style="margin-bottom:12px">
    <div class="card"><div class="cl">Середній дохід/міс <span style="color:#bbb;font-weight:400">(зарплата)</span></div><div class="cv gold">${fmt(avgInc)} ${BS}</div><div class="cs">медіана ${fmt(medInc)} ${BS}</div></div>
    <div class="card"><div class="cl">Середні витрати/міс</div><div class="cv" style="color:#c04a3a">${fmt(avgExp)} ${BS}</div><div class="cs">медіана ${fmt(medExp)} ${BS}</div></div>
    <div class="card"><div class="cl">Середній баланс/міс</div><div class="cv ${avgBal>=0?'pos':'neg'}">${sgn(avgBal)}${fmt(avgBal)} ${BS}</div></div>
  </div>

  <div class="st">Норма заощаджень</div>
  <div class="cc" style="margin-bottom:12px">
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
      <span style="font-size:32px;font-weight:300;color:${savingsRate>=20?'#1a7a4a':savingsRate>=0?'#8B6914':'#b83a2a'}">${savingsRate.toFixed(1)}%</span>
      <span style="font-size:11px;color:#aaa">від доходу лишається невитраченим в середньому за місяць</span>
    </div>
    <div style="font-size:11px;color:#999">${savingsRate>=20?'Хороший показник — 20%+ вважається орієнтиром фінансової дисципліни.':savingsRate>=0?'Помірний показник — є простір для збільшення заощаджень.':'Витрати в середньому перевищують дохід.'}</div>
  </div>

  <div class="st">Найкращі / найгірші місяці</div>
  <div class="cards2" style="margin-bottom:12px">
    <div class="card"><div class="cl">Найкращий місяць (баланс)</div><div class="cv pos">${bestMonth?'+'+fmt(bestMonth.bal)+' '+BS:'—'}</div><div class="cs">${bestMonth?M[bestMonth.mi]+' '+bestMonth.year:''}</div></div>
    <div class="card"><div class="cl">Найгірший місяць (баланс)</div><div class="cv neg">${worstMonth?fmt(worstMonth.bal)+' '+BS:'—'}</div><div class="cs">${worstMonth?M[worstMonth.mi]+' '+worstMonth.year:''}</div></div>
    <div class="card"><div class="cl">Найвищий дохід за місяць</div><div class="cv gold">${bestIncMonth?fmt(bestIncMonth.inc)+' '+BS:'—'}</div><div class="cs">${bestIncMonth?M[bestIncMonth.mi]+' '+bestIncMonth.year:''}</div></div>
    <div class="card"><div class="cl">Найвищі витрати за місяць</div><div class="cv" style="color:#c04a3a">${bestExpMonth?fmt(bestExpMonth.exp)+' '+BS:'—'}</div><div class="cs">${bestExpMonth?M[bestExpMonth.mi]+' '+bestExpMonth.year:''}</div></div>
  </div>

  <div class="st">Найкращі / найгірші роки</div>
  <div class="cards2" style="margin-bottom:12px">
    <div class="card"><div class="cl">Найкращий рік (баланс)</div><div class="cv pos">${bestYear?'+'+fmt(bestYear.bal)+' '+BS:'—'}</div><div class="cs">${bestYear?bestYear.year:''}</div></div>
    <div class="card"><div class="cl">Найгірший рік (баланс)</div><div class="cv neg">${worstYear?fmt(worstYear.bal)+' '+BS:'—'}</div><div class="cs">${worstYear?worstYear.year:''}</div></div>
  </div>

  <div class="st">Стабільність</div>
  <div class="cards3" style="margin-bottom:12px">
    <div class="card"><div class="cl">Місяців з профіцитом</div><div class="cv pos">${surplusCount} <span style="font-size:12px;color:#bbb">з ${n}</span></div><div class="cs">${n?Math.round(surplusCount/n*100):0}%</div></div>
    <div class="card"><div class="cl">Місяців з дефіцитом</div><div class="cv neg">${deficitCount} <span style="font-size:12px;color:#bbb">з ${n}</span></div><div class="cs">${n?Math.round(deficitCount/n*100):0}%</div></div>
    <div class="card"><div class="cl">Волатильність доходу</div><div class="cv" style="color:#8B6914">±${incVolatilityPct.toFixed(0)}%</div><div class="cs">${incVolatilityPct<20?'стабільний дохід':incVolatilityPct<40?'помірні коливання':'нестабільний дохід'}</div></div>
  </div>

  <div class="st">Тренд</div>
  <div style="margin-bottom:12px">
    <div class="card"><div class="cl">Середня зміна доходу рік до року</div><div class="cv ${avgYoy===null?'':avgYoy>=0?'pos':'neg'}">${avgYoy===null?'недостатньо даних':(avgYoy>=0?'+':'')+avgYoy.toFixed(1)+'%'}</div><div class="cs">${avgYoy===null?'':'в середньому за '+yoyChanges.length+' '+(yoyChanges.length===1?'рік':'роки(-ів)')}</div></div>
  </div>
  `;
}

// ── SETTINGS ────────────────────────────────────────────────
function renderSettings(){
  const mc=Object.values(DB.monthly).flatMap(d=>d.inc).filter(v=>v!=null).length;
  const le=localStorage.getItem('fin_bk')||'—';
  const curs=getCurs();const base=getBase();
  document.getElementById('content').innerHTML=`
  <div class="st">Стан бази</div>
  <div class="cc"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
    <div><div class="cl">Місяців</div><div class="cv">${mc}</div></div>
    <div><div class="cl">Знімків</div><div class="cv">${DB.portfolio.length}</div></div>
    <div><div class="cl">Записів IBKR</div><div class="cv">${(DB.ibkr_history||[]).length}</div></div>
    <div><div class="cl">Записів ОВДП</div><div class="cv">${(DB.ovdp_history||[]).length}</div></div>
    <div><div class="cl">Інвестицій (років)</div><div class="cv">${DB.investManual.length}</div></div>
    <div><div class="cl">Остання копія</div><div style="font-size:12px;color:#aaa;margin-top:4px">${le}</div></div>
  </div></div>
  <div class="st">Валюти та курси</div>
  <div class="fc">
    <div class="ct">Базова валюта <span style="font-size:10px;font-weight:400;color:#bbb">(все рахується відносно до неї)</span></div>
    <select id="base-cur-sel" style="background:#faf9f7;border:1px solid #e0ddd6;border-radius:6px;padding:6px 10px;font-size:13px;margin-bottom:10px">
      ${curs.map(c=>`<option value="${c.code}" ${c.code===base?'selected':''}>${c.code} ${c.symbol} — ${c.name}</option>`).join('')}
    </select>
  </div>
  <div class="fc">
    <button class="cbtn" id="btn-cur-toggle" style="margin-bottom:0">▼ Активні валюти <span style="font-size:10px;color:#aaa">(${curs.length})</span></button>
    <div id="cur-table-wrap" style="display:none;margin-top:8px">
    <table class="mt" style="margin-bottom:12px"><thead><tr><th style="text-align:left">Код</th><th style="text-align:left">Символ</th><th style="text-align:left">Назва</th><th>Курс до ${base}</th><th></th></tr></thead>
    <tbody id="cur-tbody">${curs.map((c,i)=>`<tr>
      <td style="font-weight:600;color:#1a1a1a">${c.code}</td>
      <td><input id="csym${i}" value="${c.symbol}" style="width:44px;background:#faf9f7;border:1px solid #e0ddd6;border-radius:4px;padding:3px 6px;font-size:12px;text-align:center" onchange="DB.currencies[${i}].symbol=this.value;sv()"></td>
      <td><input id="cname${i}" value="${c.name}" style="width:140px;background:#faf9f7;border:1px solid #e0ddd6;border-radius:4px;padding:3px 6px;font-size:12px" onchange="DB.currencies[${i}].name=this.value;sv()"></td>
      <td style="text-align:right">${c.code===base?`<span style="color:#aaa;font-size:11px">1 (базова)</span>`:`<input type="number" step="0.01" value="${c.rateToBase}" style="width:90px;background:#faf9f7;border:1px solid #e0ddd6;border-radius:4px;padding:3px 6px;font-size:12px;text-align:right" onchange="DB.currencies[${i}].rateToBase=+this.value;sv()">`}</td>
      <td>${c.code===base?'':'<button class="ic" style="color:#e0a0a0;font-size:16px" onclick="if(confirm(\\`Видалити \${c.code}?\\`)){DB.currencies.splice(\${i},1);sv();renderTab(activeTab)}">×</button>'}</td>
    </tr>`).join('')}</tbody></table>
    </div>
    <div style="font-size:10px;color:#aaa;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 8px">Додати валюту</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <input id="nc-code" placeholder="Код (BTC)" style="width:80px;background:#faf9f7;border:1px solid #e0ddd6;border-radius:6px;padding:6px 9px;font-size:12px">
      <input id="nc-sym" placeholder="Символ (₿)" style="width:70px;background:#faf9f7;border:1px solid #e0ddd6;border-radius:6px;padding:6px 9px;font-size:12px">
      <input id="nc-name" placeholder="Назва" style="flex:1;min-width:100px;background:#faf9f7;border:1px solid #e0ddd6;border-radius:6px;padding:6px 9px;font-size:12px">
      <input id="nc-rate" type="number" placeholder="Курс" style="width:90px;background:#faf9f7;border:1px solid #e0ddd6;border-radius:6px;padding:6px 9px;font-size:12px">
      <button class="btn btnp" id="btn-addcur" style="white-space:nowrap">+ Додати</button>
    </div>
    <div class="btnr-wrap" style="gap:8px">
      <button class="btn btng" id="btn-fetchrates">&#127760; Оновити курси з інтернету</button>
      <button class="btn btnr2" id="btn-reset-curs" style="font-size:11px">× Скинути валюти</button>
    </div>
    <div id="rates-status" style="margin-top:8px;font-size:11px;color:#aaa"></div>
  </div>
  <div class="st">Резервна копія</div>
  <div class="fc">
    <div class="ct">Зберегти</div>
    <p style="font-size:12px;color:#aaa;margin-bottom:12px">Збережіть усі дані як JSON-файл собі на пристрій.</p>
    <button class="btn btnp" id="bexp">Зберегти резервну копію</button>
    <div style="font-size:11px;color:#bbb;margin-top:8px" id="ets"></div>
  </div>
  <div class="fc">
    <div class="ct">Відновити з файлу</div>
    <p style="font-size:12px;color:#aaa;margin-bottom:12px">Виберіть раніше збережений JSON-файл. Поточні дані будуть замінені.</p>
    <div class="drop" id="drp">
      <input type="file" id="finp" accept=".json">
      <div style="font-size:13px;color:#888;margin-bottom:4px">Натисни або перетягни .json файл сюди</div>
      <div style="font-size:11px;color:#bbb">Тільки файли .json</div>
    </div>
    <div class="sbox" id="ist"></div>
  </div>
  <div class="st">Небезпечна зона</div>
  <div class="fc" style="border-color:#f0a0a0">
    <div class="ct" style="color:#c04a3a">Скидання</div>
    <p style="font-size:12px;color:#aaa;margin-bottom:12px">Замінить усі дані на початкові значення.</p>
    <button class="btn btnr2" id="brst">Скинути всі дані</button>
  </div>`;

  document.getElementById('bexp').onclick=()=>{
    const now=new Date(),ds=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),ts=now.toTimeString().slice(0,5).replace(':','-');
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fin_backup_'+ds+'_'+ts+'.json';a.click();URL.revokeObjectURL(url);
    const lbl=ds+' '+ts.replace('-',':');localStorage.setItem('fin_bk',lbl);document.getElementById('ets').textContent='Збережено: '+lbl;
  };
  if(le!=='—')document.getElementById('ets').textContent='Остання копія: '+le;

  const drp=document.getElementById('drp'),fi=document.getElementById('finp');
  function sst(msg,bg,col){const el=document.getElementById('ist');el.textContent=msg;el.style.background=bg;el.style.color=col;el.style.border='1px solid '+col+'44';el.style.display='block';}
  drp.onclick=()=>fi.click();
    drp.ondragover=e=>{e.preventDefault();drp.style.borderColor='#8B6914';drp.style.background='#fffdf8';};
  drp.ondragleave=()=>{drp.style.borderColor='#e0ddd6';drp.style.background='#faf9f7';};
  drp.ondrop=e=>{e.preventDefault();drp.style.borderColor='#e0ddd6';drp.style.background='#faf9f7';const f=e.dataTransfer.files[0];if(f)proc(f);};
  fi.onchange=e=>{const f=e.target.files[0];if(f)proc(f);};
  function proc(file){
    if(!file.name.endsWith('.json')){sst('Потрібен файл .json','#fff4f4','#c04a3a');return;}
    sst('Читання...','#fdf9f0','#8B6914');
    const reader=new FileReader();
    reader.onerror=()=>sst('Помилка читання файлу','#fff4f4','#c04a3a');
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.monthly&&!d.ibkr_history&&!d.portfolio){throw new Error('Невідомий формат');}
        DB=migrate(d);
        updateBS();
        try{localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem('fin_bk','відновлено з '+file.name);}catch(le){console.warn('localStorage:',le);}
        sst('✓ Дані відновлено з "'+file.name+'"','#f0f9f4','#1a7a4a');
        setTimeout(()=>renderTab(activeTab),300);
      }catch(e){sst('Помилка: '+e.message,'#fff4f4','#c04a3a');console.error(e);}
    };
    reader.readAsText(file);
  }
  // Currency handlers
  const curToggleBtn=document.getElementById('btn-cur-toggle');
  const curTableWrap=document.getElementById('cur-table-wrap');
  if(curToggleBtn&&curTableWrap){curToggleBtn.onclick=()=>{const open=curTableWrap.style.display==='none';curTableWrap.style.display=open?'block':'none';curToggleBtn.innerHTML=(open?'▲':'▼')+' Активні валюти <span style="font-size:10px;color:#aaa">('+getCurs().length+')</span>';};}
  const baseSel=document.getElementById('base-cur-sel');
  if(baseSel)baseSel.onchange=()=>{DB.baseCurrency=baseSel.value;updateBS();sv();renderTab(activeTab);};
  const resetCursBtn=document.getElementById('btn-reset-curs');
  if(resetCursBtn)resetCursBtn.onclick=()=>{if(confirm('Скинути список валют до базових UAH, USD, EUR?')){DB.currencies=JSON.parse(JSON.stringify(DC));sv();renderTab(activeTab);}};
  const addCurBtn=document.getElementById('btn-addcur');
  if(addCurBtn)addCurBtn.onclick=()=>{
    const code=(document.getElementById('nc-code').value||'').toUpperCase().trim();
    const sym=document.getElementById('nc-sym').value.trim()||code;
    const name=document.getElementById('nc-name').value.trim()||code;
    const rate=parseFloat(document.getElementById('nc-rate').value)||1;
    if(!code){alert('Вкажіть код валюти');return;}
    if(DB.currencies.find(c=>c.code===code)){alert('Ця валюта вже є в списку');return;}
    DB.currencies.push({code,symbol:sym,name,rateToBase:rate});sv();renderTab(activeTab);};
  const fetchBtn=document.getElementById('btn-fetchrates');
  if(fetchBtn)fetchBtn.onclick=async()=>{
    const st2=document.getElementById('rates-status');
    if(st2)st2.innerHTML='<span style="color:#8B6914">Завантажуємо…</span>';
    try{
      const nbuR=await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');
      const nbu=await nbuR.json();
      const nbuMap={};nbu.forEach(r=>{nbuMap[r.cc]=r.rate;});
      const cgMap={BTC:'bitcoin',ETH:'ethereum',SOL:'solana',TON:'the-open-network',BNB:'binancecoin'};
      const cgIds=Object.values(cgMap).join(',');
      const cgR=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+cgIds+'&vs_currencies=uah');
      const cgData=await cgR.json();
      const cgUah={};Object.entries(cgMap).forEach(([code,id])=>{if(cgData[id])cgUah[code]=cgData[id].uah;});
      const base=getBase();const baseToUah=base==='UAH'?1:(nbuMap[base]||cgUah[base]||1);
      let updated=0;
      DB.currencies.forEach((c,i)=>{
        if(c.code===base)return;
        const rUah=nbuMap[c.code]||cgUah[c.code]||null;
        if(rUah){DB.currencies[i].rateToBase=Math.round(rUah/baseToUah*1000)/1000;updated++;}
      });
      sv();
      if(st2)st2.innerHTML='<span style="color:#1a7a4a">✓ Оновлено '+updated+' курсів — '+new Date().toLocaleTimeString('uk-UA')+'</span>';
      renderTab(activeTab);
    }catch(e){if(st2)st2.innerHTML='<span style="color:#c04a3a">Помилка: '+e.message+'</span>';}};
  document.getElementById('brst').onclick=()=>{if(confirm('Скинути ВСІ дані? Цю дію неможливо скасувати.')){DB=migrate({});updateBS();try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}renderTab(activeTab);}};
}

function renderTab(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==tab));if(tab==='overview')renderOverview();else if(tab==='current')renderCurrentYear();else if(tab==='portfolio')renderPortfolio();else if(tab==='invest')renderInvest();else if(tab==='analysis')renderAnalysis();else if(tab==='settings')renderSettings();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>renderTab(t.dataset.tab));

// ВАЖЛИВО: Дані зберігаються в localStorage браузера (ключ "fin_v3")
// Резервні копії — вкладка "Дані"
load();
updateBS();
renderTab('overview');


</script>
